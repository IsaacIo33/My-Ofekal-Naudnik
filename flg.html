<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Language Generator</title>
    <style>
        body {
            margin: 0;
            background-size: 100% 100vh;
            font-family: system-ui;
            background-attachment: fixed;
        }

        h1 {
            margin: 0;
        }

        nav {
            width: 0;
            height: 100vh;
            background-color: rgba(255, 255, 255, .7);
            box-shadow: 5px 0 10px rgba(0, 0, 0, .5);
            position: fixed;
            transition: 0.1s;
            overflow: auto;
            text-align: center;
            margin-top: -27px;
        }

        .rb {
            width: 100%;
            padding: 10px;
            border: none;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            cursor: pointer;
            transition: 0.1s;
            margin: 0;
        }

        .rb:hover {
            background-color: lightblue;
            color: darkblue;
        }

        nav p {
            margin: 10px;
        }

        #openCloseSidebar {
            margin: 10px;
            padding: 10px;
            font-size: 2rem;
            background-color: white;
            border: none;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, .5);
            cursor: pointer;
            transition: 0.1s;
            position: fixed;
        }

        #openCloseSidebar:hover {
            background-color: rgba(255, 255, 255, .5);
            color: white;
            -webkit-text-stroke: 1px black;
        }

        nav input {
            width: 25%;
            padding: 10px;
            border: 1px solid black;
            background-color: white;
            border-radius: 25px;
        }

        button {
            background-color: white;
            color: black;
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
            transition: 0.1s;
            cursor: pointer;
        }

        button:hover {
            background-color: black;
            color: white;
            border: 1px solid white;
        }

        h1 {
            text-align: center;
            font-family: algerian, papyrus, system-ui;
            color: white;
            -webkit-text-stroke: 1px black;
            text-shadow: 5px 5px 10px rgba(0, 0, 0, .5);
        }

        .container {
            background-color: rgba(0, 0, 0, .5);
            border-radius: 25px;
            margin: 10px;
            padding: 10px;
            color: white;
            text-align: center;
        }
    </style>
</head>


<body id="body">
    <nav id="nav">
        <h2>Menu</h2>
        <button onclick="newLanguage()" class="rb">Generate Language!</button>
        <button onclick="saveLanguage()" class="rb">Save Language</button>
        <button onclick="randomizeBackground()" class="rb">Randomize Background</button>
        <h2>Configuration Settings</h2>
        <p>Consonants: <span id="consonants"></span></p>
        <label for="addConsonant">
            Add Consonants (or Diagraphs):
            <input type="text" name="addConsonant" id="addConsonant" />
            <button onclick="newConsonant()">Submit</button>
            <button onclick="consonants = []">Clear</button>
            <button onclick="randomizeConsonants()">Randomize</button>
        </label>
        <hr>
        <p>Vowels: <span id="vowels"></span></p>
        <label for="addConsonant">
            Add Vowels (or Syllaballic Consonants):
            <input type="text" name="addVowel" id="addVowel" />
            <button onclick="newVowel()">Submit</button>
            <button onclick="vowels = []">Clear</button>
            <button onclick="randomizeVowels()">Randomize</button>
        </label>
        <p>Not just the latin alphabet is supported; so you can add anything in consonants and in vowels.</p>
    </nav>
    <button id="openCloseSidebar" onclick="toggleMenu()" title="Alt+O, Alt+Shift+O" accesskey="o">+</button>
    <h1 id="heading">FANTASY LANGUAGE GENERATOR</h1>

            word = "";

                let newSyllable = vowels[Math.floor(Math.random() * vowels.length)];
                let cNewSyllable = Math.floor(Math.random() * 2);
                let newSyllableC = Math.floor(Math.random() * 2);
                if (cNewSyllable == 0) {
                    newSyllable = consonants[Math.floor(Math.random() * consonants.length)] + newSyllable;

        function shuffle(array) {
            let currentIndex = array.length;

            // While there remain elements to shuffle...
            while (currentIndex != 0) {

                // Pick a remaining element...
                let randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                // And swap it with the current element.
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
        }

            consonantsEl.innerText = consonants;
            vowelsEl.innerText = vowels;
        }
