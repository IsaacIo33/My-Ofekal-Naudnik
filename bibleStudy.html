<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study</title>
    <style>
        body {
            margin: 0;
            cursor: default;
            user-select: none;
            background-color: rgb(229, 199, 157);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        #bottombar {
            width: 100%;
            height: 50px;
            background-color: #222222;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            color: white;
        }

        #topbar {
            width: 100%;
            height: 50px;
            background-color: #222222;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            color: white;
        }

        .container {
            width: 100vw;
            height: calc(100vh - 100px);
        }

        #bible {
            padding: 50px;
            overflow: auto;
            width: calc(100vw - 100px);
            height: calc(100vh - 200px);
        }

        #verseNum {
            font-weight: bold;
            font-size: 1.3rem;
        }

        #book {
            width: 250px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            border: none;
            color: rgb(63, 63, 255);
            font-size: 1.5rem;
        }

        #chapter {
            width: 50px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            border: none;
            color: rgb(63, 63, 255);
            font-size: 1.5rem;
        }
    </style>
</head>
<nav id="topbar">
    <h1>Bible Study</h1>
    <select name="book" id="book" onchange="getChapter()"></select>
    <select name="chapter" id="chapter" onchange="getVerses()"></select>
</nav>
<div class="container" id="bible"></div>
<nav id="bottombar"></nav>

<body>
    <script src="jquery.js"></script>
    <script>
        let books = [
            {
                name: "Genesis",
                chapters: 50
            },
            {
                name: "Exodus",
                chapters: 40
            },
            {
                name: "Leviticus",
                chapters: 27
            },
            {
                name: "Numbers",
                chapters: 36
            },
            {
                name: "Deuteronomy",
                chapters: 34
            },
            {
                name: "Joshua",
                chapters: 24
            },
            {
                name: "Judges",
                chapters: 21
            },
            {
                name: "Ruth",
                chapters: 4
            },
            {
                name: "I Samuel",
                chapters: 31
            },
            {
                name: "II Samuel",
                chapters: 24
            },
            {
                name: "I Kings",
                chapters: 22
            },
            {
                name: "II Kings",
                chapters: 25
            },
            {
                name: "I Chronicles",
                chapters: 29
            },
            {
                name: "II Chronicles",
                chapters: 36
            },
            {
                name: "Ezra",
                chapters: 10
            },
            {
                name: "Nehemiah",
                chapters: 13
            },
            {
                name: "Esther",
                chapters: 10
            },
            {
                name: "Job",
                chapters: 42
            },
            {
                name: "Psalms",
                chapters: 150
            },
            {
                name: "Proverbs",
                chapters: 31
            },
            {
                name: "Ecclesiastes",
                chapters: 12
            },
            {
                name: "Song of Solomon",
                chapters: 8
            },
            {
                name: "Isaiah",
                chapters: 66
            },
            {
                name: "Jeremiah",
                chapters: 52
            },
            {
                name: "Lamentations",
                chapters: 5
            },
            {
                name: "Ezekiel",
                chapters: 48
            },
            {
                name: "Daniel",
                chapters: 12
            },
            {
                name: "Hosea",
                chapters: 14
            },
            {
                name: "Joel",
                chapters: 3
            },
            {
                name: "Amos",
                chapters: 9
            },
            {
                name: "Obadiah",
                chapters: 1
            },
            {
                name: "Jonah",
                chapters: 4
            },
            {
                name: "Micah",
                chapters: 7
            },
            {
                name: "Nahum",
                chapters: 3
            },
            {
                name: "Habakkuk",
                chapters: 3
            },
            {
                name: "Zephaniah",
                chapters: 3
            },
            {
                name: "Haggai",
                chapters: 2
            },
            {
                name: "Zechariah",
                chapters: 14
            },
            {
                name: "Malachi",
                chapters: 4
            },
            {
                name: "Matthew",
                chapters: 28
            },
            {
                name: "Mark",
                chapters: 16
            },
            {
                name: "Luke",
                chapters: 24
            },
            {
                name: "John",
                chapters: 21
            },
            {
                name: "Acts",
                chapters: 28
            },
            {
                name: "Romans",
                chapters: 16
            },
            {
                name: "I Corinthians",
                chapters: 16
            },
            {
                name: "II Corinthians",
                chapters: 13
            },
            {
                name: "Galatians",
                chapters: 6
            },
            {
                name: "Ephesians",
                chapters: 6
            },
            {
                name: "Phillipians",
                chapters: 4
            },
            {
                name: "Colossians",
                chapters: 4
            },
            {
                name: "I Thessalonians",
                chapters: 5
            },
            {
                name: "II Thessalonians",
                chapters: 3
            },
            {
                name: "I Timothy",
                chapters: 6
            },
            {
                name: "II Timothy",
                chapters: 4
            },
            {
                name: "Titus",
                chapters: 3
            },
            {
                name: "Philemon",
                chapters: 1
            },
            {
                name: "Hebrews",
                chapters: 13
            },
            {
                name: "James",
                chapters: 5
            },
            {
                name: "I Peter",
                chapters: 5
            },
            {
                name: "II Peter",
                chapters: 3
            },
            {
                name: "I John",
                chapters: 5
            },
            {
                name: "II John",
                chapters: 1
            },
            {
                name: "III John",
                chapters: 1
            },
            {
                name: "Jude",
                chapters: 1
            },
            {
                name: "Revelation",
                chapters: 22
            }
        ];
        const bibleEl = document.getElementById("bible");
        const bookEl = document.getElementById("book");
        const chapterEl = document.getElementById("chapter");

        for (let i = 0; i < books.length; i++) {
            let newOptionEl = document.createElement("option");
            newOptionEl.innerText = books[i].name;
            newOptionEl.value = i;
            bookEl.appendChild(newOptionEl);
        }

        function getVerses() {
            if (books[bookEl.value].chapters == 1) {
                bibleEl.innerHTML = "";
                $.ajax({
                    type: "GET",
                    data: { translation: "kjv" },
                    url: "https://bible-api.com/" + books[bookEl.value].name.toLowerCase() + "%201?single_chapter_book_matching=indifferent",
                    success: function (data) {
                        let chapter = data.verses;
                        for (let i = 0; i < chapter.length; i++) {
                            let newVerseEl = document.createElement("p");
                            newVerseEl.innerHTML = "<span id='verseNum'>" + (i + 1) + "</span> " + chapter[i].text;
                            bibleEl.appendChild(newVerseEl);
                        }
                    }
                });
            } else {
                bibleEl.innerHTML = "";
                $.ajax({
                    type: "GET",
                    data: { translation: "kjv" },
                    url: "https://bible-api.com/" + books[bookEl.value].name.toLowerCase() + " " + (Number(chapterEl.value) + 1),
                    success: function (data) {
                        let chapter = data.verses;
                        for (let i = 0; i < chapter.length; i++) {
                            let newVerseEl = document.createElement("p");
                            newVerseEl.innerHTML = "<span id='verseNum'>" + (i + 1) + "</span> " + chapter[i].text;
                            bibleEl.appendChild(newVerseEl);
                        }
                    }
                });
            }
        }

        function getChapter() {
            chapterEl.style.display = "block";
            bibleEl.innerHTML = "";
            chapterEl.innerHTML = "";
            for (let i = 0; i < books[bookEl.value].chapters; i++) {
                let newChapterEl = document.createElement("option");
                newChapterEl.innerText = i + 1;
                newChapterEl.value = i;
                chapterEl.appendChild(newChapterEl);
            }
            getVerses();
        }
        getChapter();

        document.addEventListener("contextmenu", (event) => {
            event.preventDefault();
        });
    </script>
</body>

</html>
