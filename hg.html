<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Generator</title>
    <style>
        body {
            background-size: 100% 100vh;
            margin: 0;
            font-family: algerian;
            background-attachment: fixed;
        }

        #openClose,
        #nextTurn {
            background-color: lightgrey;
            margin: 10px;
            padding: 10px;
            border: 5px outset darkgrey;
            font-size: 2rem;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, .5);
            cursor: pointer;
            position: fixed;
        }

        #openClose:active,
        #nextTurn:active {
            border: 5px inset grey;
            background-color: darkgrey;
        }

        nav {
            width: 0;
            height: 100vh;
            background-color: lightgrey;
            position: fixed;
            border-right: 5px outset darkgrey;
            box-shadow: 5px 0 10px rgba(0, 0, 0, .5);
            transition: 0.1s;
            margin-top: -27px;
            overflow: auto;
            text-align: center;
        }

        h1 {
            text-align: center;
            font-family: copperplate gothic;
            color: lightgrey;
            -webkit-text-stroke: 1px black;
        }

        input {
            border-radius: 25px;
        }

        button {
            background-color: white;
            color: black;
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
            cursor: pointer;
            transition: 0.1s;
        }

        button:hover {
            background-color: black;
            color: white;
            border: 1px solid white;
        }

        .rb {
            width: 100%;
            border-left: none;
            border-right: none;
            margin: 0;
        }

        .rb:hover {
            border-left: none;
            border-right: none;
        }

        .container {
            background-color: rgba(0, 0, 0, .5);
            margin: 10px;
            padding: 10px;
            color: white;
            border-radius: 25px;
            text-align: center;
        }

        li {
            margin: 10px;
        }
    </style>
</head>

        <h2>Configuration Settings</h2>
        <button class="rb" onclick="newHistory()">Generate History!</button>

        <button class="rb" onclick="randomizeBackground()">Randomize Background</button>

            <button onclick="addAllCountries()">Add All Modern Countries</button>
            <p>New Countries Banned: <span id="areBanned">false</span></p>
            <button onclick="toggleBanNewCountries()">Toggle Ban New Countries</button>
        </label>
        <p>Year: <span id="year"></span></p>
        <label for="year">
            Set Year:
            <input type="number" id="setYear">
            <button onclick="year = setYearEl.value">Submit</button>
            <button onclick="randomizeYear()">Random Year</button>
            <button onclick="year = new Date().getFullYear()">Current Year</button>
        </label>
        <p>Nuclear Research: <span id="nr"></span>%</p>
        <label for="setNuclearResearch">
            Nuclear Research:
            <input type="number" name="setNuclearResearch" id="setNuclearResearch">
            <button onclick="setNuclearResearch()">Submit</button>
            <button onclick="nukeResearch = Math.floor(Math.random()*101)">Randomize</button>

            Add Nuclear Power:

            <button onclick="nuclearPowers = []">Clear</button>
            <button onclick="randomizeNuclearPowers()">Randomize</button>
            <button onclick="addAllNuclearPowers()">Add All Modern Nuclear Powers</button>
        </label>
    </nav>

        function generateWord(word) {
            word = "";
            for (let i = 0; i < Math.ceil(Math.random() * 5); i++) {
                let newSyllable = vowels[Math.floor(Math.random() * vowels.length)];
                let cSyllable = Math.floor(Math.random() * 2);
                let syllableC = Math.floor(Math.random() * 2);
                if (cSyllable == 0) {
                    newSyllable = consonants[Math.floor(Math.random() * consonants.length)] + newSyllable;
                }
                if (syllableC == 0) {
                    newSyllable = newSyllable + consonants[Math.floor(Math.random() * consonants.length)];
                }
                word = word + newSyllable;
            }
            word = word.split("");
            word[0] = word[0].toUpperCase();
            word = word.join("");
            return word;
        }
